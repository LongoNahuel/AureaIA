# CI de validación: corre en cada push/PR a main. No despliega nada:
# su único trabajo es que main nunca quede con lint roto o tests rojos.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff check
        run: ruff check aurea_vms tests
      - name: ruff format --check
        run: ruff format --check aurea_vms tests

  tests:
    name: Tests + cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # PySide6 sin display: los tests nunca abren ventanas reales.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12 = la version verificada en las maquinas de desarrollo;
          # mediapipe publica wheels py3-none asi que no ata la version.
          python-version: "3.12"
          cache: pip
      - name: Dependencias de sistema para Qt/OpenCV/MediaPipe headless
        run: |
          sudo apt-get update
          # libgles2: libmediapipe.so linkea contra libGLESv2.so.2 y se
          # carga recien al crear el primer detector (Tasks API) -- sin
          # este paquete el paso de integracion muere con OSError.
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libgles2 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Instalar proyecto
        run: pip install -e ".[dev]"
      - name: Tests unitarios con gate de cobertura
        run: pytest -m "not integration" --cov
      - name: Tests de integración (modelos .tflite reales)
        run: pytest -m integration -v
