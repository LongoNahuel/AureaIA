# Compila el .exe de Windows (onedir) y lo sube como artifact.
# Se dispara a mano (workflow_dispatch), al taggear vX.Y.Z, y en los PR que
# tocan el empaquetado -- no en cada push: el build tarda ~45 min y el CI
# normal ya valida el codigo.
#
# El filtro de paths existe porque una regresion de bundle no la ve ningun
# otro workflow: el spec resuelve DLLs nativas (collect_all de onnxruntime)
# y el WSDL de onvif-zeep en runtime, asi que solo el smoke del .exe la
# detecta. Sin este trigger, vivia en main hasta el proximo release.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "aurea_vms.spec"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      # El smoke no debe ensuciar el perfil del runner.
      AUREA_DATA_DIR: ${{ github.workspace }}\smoke-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar proyecto + PyInstaller
        run: pip install -e . pyinstaller
      - name: Smoke pre-build (entorno completo, 4 analizadores reales)
        run: python -m aurea_vms.main --smoke
      - name: Compilar onedir
        run: pyinstaller aurea_vms.spec --noconfirm
      - name: Smoke del ejecutable
        run: .\dist\AureaVMS\AureaVMS.exe --smoke
      - name: Empaquetar zip
        run: Compress-Archive -Path dist\AureaVMS -DestinationPath AureaVMS-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AureaVMS-win64
          path: AureaVMS-win64.zip
          retention-days: 30
