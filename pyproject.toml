[project]
name = "aurea-vms"
version = "0.1.0"
description = "AureaIA VMS - SuperCliente LAN con analiticas de IA embebidas"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.10",
    "SQLAlchemy>=2.0",
    "numpy>=1.26",
    "onvif-zeep>=0.2.12",
    "wsdiscovery>=2.0",
    # >=1.0 elimino por completo la API legacy `mediapipe.solutions`; en Windows
    # ni siquiera 0.10.x la incluye (solo trae la Tasks API), asi que fijamos
    # la version usada durante el desarrollo/pruebas para reproducibilidad.
    "mediapipe==0.10.35",
    "psutil>=5.9",
    "PySide6-Fluent-Widgets[full]>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.scripts]
aurea-vms = "aurea_vms.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aurea_vms*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errores
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplificaciones
]
# E501: el formateador maneja el largo de linea; strings/comentarios largos
# heredados no justifican romper el build.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests que cargan modelos de IA reales (lentos, opcionales)",
]

[tool.coverage.run]
# El gate de cobertura arranca midiendo el backend (core/models/config).
# La UI (aurea_vms/ui, ~54% del codigo) se suma al gate a medida que avanza
# el backfill de tests con pytest-qt -- objetivo final: >=80% del paquete.
source = [
    "aurea_vms.core",
    "aurea_vms.models",
    "aurea_vms.config",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Gate acordado: nace en 60 y sube hacia 80 a medida que crece el backfill.
# 2026-08-24: backend en 74% -> gate a 70. Misma noche: 82% -> gate a 80
# (la meta acordada). Proximo paso: sumar aurea_vms/ui al scope.
fail_under = 80
