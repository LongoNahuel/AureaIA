[project]
name = "aurea-vms"
version = "0.1.0"
description = "AureaIA VMS - SuperCliente LAN con analiticas de IA embebidas"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.10",
    "SQLAlchemy>=2.0",
    # Versionado de esquema. Las revisiones viven DENTRO del paquete
    # (aurea_vms/migrations) para que PyInstaller las empaquete: sin ellas,
    # el .exe no puede migrar la base del cliente.
    "alembic>=1.13",
    # Cifrado en reposo de las credenciales de camara (core/credential_store.py).
    "cryptography>=42.0",
    "numpy>=1.26",
    "onvif-zeep>=0.2.12",
    "wsdiscovery>=2.0",
    # Runtime CPU-only para los modelos .onnx (YuNet, YOLOX-Tiny) -- ver
    # docs/ARQUITECTURA.md. Reemplaza a mediapipe (sacado del proyecto:
    # mas liviano, sin los problemas recurrentes de carga de DLL nativas
    # en Windows/Linux que traia MediaPipe Tasks API).
    "onnxruntime>=1.20",
    "psutil>=5.9",
    "PySide6-Fluent-Widgets[full]>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.scripts]
aurea-vms = "aurea_vms.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aurea_vms*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errores
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplificaciones
]
# E501: el formateador maneja el largo de linea; strings/comentarios largos
# heredados no justifican romper el build.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests que cargan modelos de IA reales (lentos, opcionales)",
]

[tool.coverage.run]
# El gate de cobertura arranca midiendo el backend (core/models/config).
# La UI (aurea_vms/ui, ~54% del codigo) se suma al gate a medida que avanza
# el backfill de tests con pytest-qt -- objetivo final: >=80% del paquete.
source = [
    "aurea_vms.core",
    "aurea_vms.models",
    "aurea_vms.config",
    "aurea_vms.migrations",
    "aurea_vms.smoke",
]
# env.py SI se ejecuta (cada migracion lo carga), pero Alembic lo importa
# con importlib bajo un nombre de modulo sintetico y coverage no puede
# atribuirle las lineas. Omitirlo evita un 0% que miente; lo que prueba que
# funciona son los tests de tests/test_db_migrations.py, que migran de verdad.
omit = ["*/migrations/env.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Gate acordado: nace en 60 y sube hacia 80 a medida que crece el backfill.
# 2026-08-24: backend en 74% -> gate a 70. Misma noche: 82% -> gate a 80
# (la meta acordada). Proximo paso: sumar aurea_vms/ui al scope.
fail_under = 80
