# Config para usar Alembic a mano en desarrollo:
#
#   alembic revision --autogenerate -m "lo que cambia"
#   alembic upgrade head
#
# La aplicacion NO usa este archivo: arma su Config en memoria y migra sola
# al arrancar (aurea_vms/models/db.py), porque en una instalacion de cliente
# no hay nadie que corra un comando.
[alembic]
script_location = aurea_vms/migrations
sqlalchemy.url = sqlite:///data/aurea_vms.sqlite3
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
